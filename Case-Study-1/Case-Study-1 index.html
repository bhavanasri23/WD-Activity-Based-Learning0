<!DOCTYPE html>
<html>
<head>
<title>Case Study 1 - E-Commerce | Bhavana Sri</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#2c3e50;color:white;padding:20px;text-align:center}
.products{display:flex;flex-wrap:wrap;justify-content:center;padding:20px}
.card{background:white;width:250px;margin:15px;border-radius:10px;box-shadow:0 2px 10px #ccc;padding:15px;text-align:center}
.card img{width:100%;height:150px;object-fit:cover;border-radius:5px}
button{background:#27ae60;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer}
button:hover{background:#219a52}
</style>
</head>
<body>
<header>
<h1>ShopEasy - E-Commerce Store</h1>
<p>Case Study 1 | WD-ABL | Bhavana Sri - 2600308</p>
</header>
<div class="products">
<div class="card">
<img src="https://via.placeholder.com/250x150?text=Laptop">
<h3>Laptop</h3>
<p>₹55,000</p>
<button onclick="alert('Added to Cart!')">Add to Cart</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/250x150?text=Phone">
<h3>Smart Phone</h3>
<p>₹25,000</p>
<button onclick="alert('Added to Cart!')">Add to Cart</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/250x150?text=Headphones">
<h3>Headphones</h3>
<p>₹2,500</p>
<button onclick="alert('Added to Cart!')">Add to Cart</button>
</div>
</div>
<script>
console.log("Case Study 1 - E-Commerce Loaded - Bhavana Sri 2600308");
</script>
</body>
</html>
